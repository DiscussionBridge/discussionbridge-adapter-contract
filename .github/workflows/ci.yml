name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24.19.0]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Record exact execution environment
        run: |
          node --version
          npm --version
          printf 'ImageOS=%s\nImageVersion=%s\nImageArch=%s\n' "$ImageOS" "$ImageVersion" "$ImageArch"

      - name: Validate the complete contract
        run: npm test

      - name: Confirm validation did not mutate tracked files
        run: git diff --exit-code
