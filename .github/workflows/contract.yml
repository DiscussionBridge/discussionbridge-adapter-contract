name: V4 contract

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['22', '24']
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Record actual runtimes
        run: |
          node --version
          php --version
      - name: Check generated runtime and schema
        run: node scripts/generate.mjs --check
      - name: Run all JavaScript and PHP parity checks
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: Run native PHP conformance
        run: php -n src/php/conformance.php
      - name: Prove URL validation without optional PHP extensions
        run: php -n -d disable_functions=iconv,iconv_strlen,iconv_strpos,iconv_strrpos,iconv_substr,iconv_mime_encode,iconv_mime_decode,iconv_mime_decode_headers,mb_ord,mb_str_split,mb_internal_encoding,idn_to_ascii,idn_to_utf8 tests/php-idna-isolation.php
      - name: Build and verify ordinary candidate package
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputName 'discussionbridge-contract-v4-${{ github.sha }}-node${{ matrix.node }}-php${{ matrix.php }}.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-node${{ matrix.node }}-php${{ matrix.php }}
          path: .artifacts/*.zip
          include-hidden-files: true
          if-no-files-found: error
